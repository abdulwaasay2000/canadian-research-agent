# docker compose run --rm ingest     -> load demo data (or edit command to --live)
# docker compose up api dashboard    -> API on :8000, dashboard on :8501
services:
  ingest:
    build: .
    env_file: [{path: .env, required: false}]
    volumes: ["./data:/app/data"]
    command: ["python", "-m", "cra.pipeline.ingest", "--synthetic"]
    profiles: ["tools"]
  tests:
    build: .
    command: ["pytest"]
    profiles: ["tools"]
  api:
    build: .
    command: ["uvicorn", "cra.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [{path: .env, required: false}]
    volumes: ["./data:/app/data"]
    ports: ["8000:8000"]
  dashboard:
    build: .
    env_file: [{path: .env, required: false}]
    volumes: ["./data:/app/data"]
    ports: ["8501:8501"]
    command: ["sh", "start.sh"]
